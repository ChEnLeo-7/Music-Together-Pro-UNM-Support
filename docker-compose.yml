services:
  music-together:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        YTDLP_VERSION: '${YTDLP_VERSION:-latest}'
    container_name: music-together
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_URL: '${CLIENT_URL:-}'
      CORS_ORIGINS: '${CORS_ORIGINS:-}'
      TRUST_PROXY_HOPS: '${TRUST_PROXY_HOPS:-0}'
      SESSION_TTL_DAYS: '${SESSION_TTL_DAYS:-30}'
      SESSION_COOKIE_SECURE: '${SESSION_COOKIE_SECURE:-true}'
      ROOM_PASSWORD_KEY: '${ROOM_PASSWORD_KEY:?ROOM_PASSWORD_KEY is required}'
      ROOM_PASSWORD_KEY_VERSION: '${ROOM_PASSWORD_KEY_VERSION:-1}'
      ROOM_ADMISSION_TTL_MS: '${ROOM_ADMISSION_TTL_MS:-300000}'
      PLATFORM_AUTH_KEY: '${PLATFORM_AUTH_KEY:?PLATFORM_AUTH_KEY is required}'
      STREAM_PROXY_SECRET: '${STREAM_PROXY_SECRET:?STREAM_PROXY_SECRET is required}'
      DATABASE_URL: '${DATABASE_URL:-file:/app/data/music-together.db}'
      AUTO_FALLBACK_ENABLED: '${AUTO_FALLBACK_ENABLED:-true}'
      UNM_SERVER_URL: '${UNM_SERVER_URL:-}'
      UNM_SERVER_TIMEOUT_MS: '${UNM_SERVER_TIMEOUT_MS:-10000}'
      MEDIA_ROOT: '${MEDIA_ROOT:-/app/data/media}'
      MEDIA_MAX_UPLOAD_BYTES: '${MEDIA_MAX_UPLOAD_BYTES:-209715200}'
      MEDIA_MAX_DURATION_SECONDS: '${MEDIA_MAX_DURATION_SECONDS:-14400}'
      MEDIA_MAX_ROOM_BYTES: '${MEDIA_MAX_ROOM_BYTES:-2147483648}'
      MEDIA_MAX_TOTAL_BYTES: '${MEDIA_MAX_TOTAL_BYTES:-10737418240}'
      MEDIA_INACTIVITY_MS: '${MEDIA_INACTIVITY_MS:-604800000}'
      MEDIA_CLEANUP_INTERVAL_MS: '${MEDIA_CLEANUP_INTERVAL_MS:-900000}'
      MEDIA_JOB_TIMEOUT_MS: '${MEDIA_JOB_TIMEOUT_MS:-600000}'
      YTDLP_PATH: '${YTDLP_PATH:-yt-dlp}'
      YTDLP_AUTO_UPDATE: '${YTDLP_AUTO_UPDATE:-false}'
      YTDLP_UPDATE_VERSION: '${YTDLP_UPDATE_VERSION:-}'
      YOUTUBE_COOKIE: '${YOUTUBE_COOKIE:-}'
      BILIBILI_COOKIE: '${BILIBILI_COOKIE:-}'
      FFMPEG_PATH: '${FFMPEG_PATH:-ffmpeg}'
    volumes:
      - music-together-data:/app/data
    networks:
      - music-together
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  music-together:
    name: music-together

volumes:
  music-together-data:
