name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/android-release.yml'
      - 'packages/android/**'
      - 'packages/client/src/hooks/useHowl.ts'
      - 'packages/client/src/hooks/usePlayer.ts'
      - 'packages/client/src/hooks/usePlayerSync.ts'
      - 'packages/client/src/lib/clockSync.ts'
      - 'packages/client/src/lib/nativePlayback.ts'
      - 'packages/shared/src/events.ts'
      - 'packages/shared/src/schemas.ts'
      - 'packages/shared/src/socket-types.ts'
      - 'packages/shared/src/types.ts'
      - 'packages/server/src/controllers/playerController.ts'
      - 'packages/server/src/services/playerService.ts'
      - 'packages/server/src/services/roomAdmissionService.ts'
  pull_request:
    paths:
      - '.github/workflows/android-release.yml'
      - 'packages/android/**'
      - 'packages/client/src/hooks/useHowl.ts'
      - 'packages/client/src/hooks/usePlayer.ts'
      - 'packages/client/src/hooks/usePlayerSync.ts'
      - 'packages/client/src/lib/clockSync.ts'
      - 'packages/client/src/lib/nativePlayback.ts'
      - 'packages/shared/src/events.ts'
      - 'packages/shared/src/schemas.ts'
      - 'packages/shared/src/socket-types.ts'
      - 'packages/shared/src/types.ts'
      - 'packages/server/src/controllers/playerController.ts'
      - 'packages/server/src/services/playerService.ts'
      - 'packages/server/src/services/roomAdmissionService.ts'

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test Android sync and compile debug variant
        working-directory: packages/android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2

  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/music-together-release.jks"

      - name: Test and build signed release APK
        working-directory: packages/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/music-together-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Name release APK
        run: cp packages/android/app/build/outputs/apk/release/app-release.apk "music-together-android-${{ github.ref_name }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: music-together-android-release-${{ github.sha }}
          path: music-together-android-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Music Together Android ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          files: music-together-android-${{ github.ref_name }}.apk
          body_path: packages/android/RELEASE_NOTES.md

      - name: Remove historical debug releases
        if: github.ref_type == 'tag'
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const release of releases) {
              if (!release.tag_name.startsWith('android-debug-')) continue;
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });
              } catch (error) {
                core.warning(`Could not delete release ${release.tag_name}: ${String(error)}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                core.warning(`Could not delete tag ${release.tag_name}: ${String(error)}`);
              }
