name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/android-debug.yml'
      - 'packages/android/**'
      - 'packages/client/src/hooks/useHowl.ts'
      - 'packages/client/src/hooks/usePlayer.ts'
      - 'packages/client/src/lib/nativePlayback.ts'
  pull_request:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'packages/android/**'
      - 'packages/client/src/hooks/useHowl.ts'
      - 'packages/client/src/hooks/usePlayer.ts'
      - 'packages/client/src/lib/nativePlayback.ts'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        working-directory: packages/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | tee android-build.log

      - name: Publish failure diagnostics
        if: failure()
        working-directory: packages/android
        run: |
          grep -E '(^e: |error: |AAPT: error)' android-build.log | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          {
            echo '## Android build failure'
            echo '```text'
            tail -n 200 android-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ github.sha }}
          path: packages/android/android-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: music-together-android-debug-${{ github.sha }}
          path: packages/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Name release APK
        if: github.ref_type == 'tag'
        run: cp packages/android/app/build/outputs/apk/debug/app-debug.apk "packages/android/app/build/outputs/apk/debug/music-together-android-${{ github.ref_name }}.apk"

      - name: Publish debug APK download
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.sha }}
          name: Android debug ${{ github.sha }}
          prerelease: true
          files: packages/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Android release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Music Together Android ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          files: packages/android/app/build/outputs/apk/debug/music-together-android-${{ github.ref_name }}.apk
          body: |
            ## 中文

            Music Together Android ${{ github.ref_name }} 提供基于 Media3 的原生后台播放体验，可连接自托管的 HTTP 或 HTTPS Music Together 服务端。

            ### 本次更新

            - 支持后台、锁屏播放和 Android 系统媒体控制。
            - 修复播放/暂停按钮与 ExoPlayer 实际状态不同步的问题。
            - 修复缓冲、切歌和 seek 期间按钮错误反复切换的问题。
            - 修复进度条触摸偏移、拖动回跳和旧时长污染新曲的问题。
            - 消除 WebView 与原生服务重复执行播放、暂停和 seek 的竞态。
            - 增加原生 NTP 时钟校准及重连状态对账。
            - 离开房间时停止播放、断开房间连接并释放前台服务。
            - 限制原生播放桥仅在配置服务器的同源页面中使用。

            ### 安装

            下载 `music-together-android-${{ github.ref_name }}.apk` 并覆盖安装。首次启动时输入你的 Music Together 服务端地址。

            ## English

            Music Together Android ${{ github.ref_name }} delivers native Media3 background playback and connects to a self-hosted Music Together server over HTTP or HTTPS.

            ### What's Changed

            - Added background and lock-screen playback with Android system media controls.
            - Fixed play/pause button state diverging from the actual ExoPlayer state.
            - Fixed false pause toggles during buffering, track changes, and seeking.
            - Fixed seek-bar touch offset, snap-back, and stale duration leaking across tracks.
            - Removed races caused by WebView and the native service executing playback commands twice.
            - Added native NTP clock calibration and playback reconciliation after reconnecting.
            - Playback, room sockets, and the foreground service are released when leaving a room.
            - Restricted the privileged native playback bridge to the configured server origin.

            ### Installation

            Download `music-together-android-${{ github.ref_name }}.apk` and install it over the previous version. Enter your Music Together server address on first launch.
