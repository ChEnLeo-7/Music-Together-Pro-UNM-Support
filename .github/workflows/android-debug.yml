name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-debug.yml'
      - 'packages/android/**'
      - 'packages/client/src/hooks/useHowl.ts'
      - 'packages/client/src/hooks/usePlayer.ts'
      - 'packages/client/src/lib/nativePlayback.ts'
  pull_request:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'packages/android/**'
      - 'packages/client/src/hooks/useHowl.ts'
      - 'packages/client/src/hooks/usePlayer.ts'
      - 'packages/client/src/lib/nativePlayback.ts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        working-directory: packages/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: music-together-android-debug-${{ github.sha }}
          path: packages/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
