name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-debug.yml'
      - 'packages/android/**'
      - 'packages/client/src/hooks/useHowl.ts'
      - 'packages/client/src/hooks/usePlayer.ts'
      - 'packages/client/src/lib/nativePlayback.ts'
  pull_request:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'packages/android/**'
      - 'packages/client/src/hooks/useHowl.ts'
      - 'packages/client/src/hooks/usePlayer.ts'
      - 'packages/client/src/lib/nativePlayback.ts'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        working-directory: packages/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | tee android-build.log

      - name: Publish failure diagnostics
        if: failure()
        working-directory: packages/android
        run: |
          {
            echo '## Android build failure'
            echo '```text'
            tail -n 200 android-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ github.sha }}
          path: packages/android/android-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: music-together-android-debug-${{ github.sha }}
          path: packages/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish debug APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.sha }}
          name: Android debug ${{ github.sha }}
          prerelease: true
          files: packages/android/app/build/outputs/apk/debug/app-debug.apk
